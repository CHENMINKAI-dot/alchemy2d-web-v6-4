name: Deploy Alchemy 2D to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          mkdir -p site
          cp index.html app.js alchemy_core.js evaluation_schedule.js fixed_protocol.js session_store.js interface_dialog.js cover_ui.css styles.css theme_v6_1.css theme_v6_3.css site/
          cp -r assets site/assets
          rm -rf site/assets/ui/source_art
          # The signed total display reads this atlas at runtime.
          mkdir -p site/assets/ui/source_art
          cp assets/ui/source_art/gothic_numeral_atlas.png site/assets/ui/source_art/
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
